  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize the card drawing functionality
      initCardDrawing();
    });
    
    function initCardDrawing() {
      const drawButton = document.getElementById('draw-button');
      const tarotDeck = document.getElementById('tarot-deck');
      const drawnCardContainer = document.getElementById('drawn-card-container');
      const interpretationArea = document.getElementById('interpretation-area');
      
      // Add event listeners
      drawButton.addEventListener('click', drawCard);
      
      // Tab switching
      document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', () => {
          // Remove active class from all tabs
          document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
          document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
          
          // Add active class to clicked tab
          button.classList.add('active');
          const tabId = button.getAttribute('data-tab');
          document.getElementById(tabId).classList.add('active');
        });
      });
      
      function drawCard() {
        // Hide the button while drawing
        drawButton.disabled = true;
        
        // Create the drawn card animation
        tarotDeck.classList.add('drawing');
        drawnCardContainer.classList.remove('hidden');
        
        // Generate a random card
        setTimeout(() => {
          const cardId = Math.floor(Math.random() * 78); // 0-77
          const isReversed = Math.random() > 0.5;
          
          // Fetch card data
          fetch(`/api/cards/id/${cardId}`)
            .then(response => response.json())
            .then(data => {
              if (data.success) {
                displayCard(data.card, isReversed, data.interpretations);
              } else {
                console.error('Error fetching card:', data.error);
                alert('Error drawing card. Please try again.');
                resetCardDrawing();
              }
            })
            .catch(error => {
              console.error('Error:', error);
              alert('Error drawing card. Please try again.');
              resetCardDrawing();
            });
        }, 1000);
      }
      
      function displayCard(card, isReversed, interpretations) {
        // Create card HTML
        const cardImage = document.createElement('img');
        cardImage.src = `/images/tarot/optimized/${card.image_filename}`;
        cardImage.alt = card.name;
        cardImage.className = isReversed ? 'card-image reversed' : 'card-image';
        
        // Clear and add the card to the container
        drawnCardContainer.innerHTML = '';
        drawnCardContainer.appendChild(cardImage);
        
        // Update card info
        document.getElementById('card-name').textContent = `${card.name} (${card.english_name})`;
        
        // Set orientation text based on current language
        const orientationKey = isReversed ? 'homepage.cardOrientation.reversed' : 'homepage.cardOrientation.upright';
        document.getElementById('card-orientation').textContent = i18n.t(orientationKey);
        
        // Update interpretation content
        const interpretation = isReversed ? interpretations.reversed : interpretations.upright;
        document.getElementById('story-content').textContent = interpretation.story_background;
        document.getElementById('symbolism-content').textContent = interpretation.symbolism;
        document.getElementById('love-content').textContent = interpretation.love;
        document.getElementById('career-content').textContent = interpretation.career;
        document.getElementById('study-content').textContent = interpretation.study;
        document.getElementById('overall-content').textContent = interpretation.overall;
        
        // Update view more link - 确保使用正确的语言路径
        const cardSlug = card.english_name.toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '');
        const detailUrl = `/zh/cards/${cardSlug}`;
        document.getElementById('view-more-link').href = detailUrl;
        
        // Show interpretation
        interpretationArea.classList.remove('hidden');
        
        // Reset draw button
        setTimeout(() => {
          tarotDeck.classList.remove('drawing');
          drawButton.disabled = false;
        }, 1000);
      }
      
      function resetCardDrawing() {
        tarotDeck.classList.remove('drawing');
        drawnCardContainer.classList.add('hidden');
        drawButton.disabled = false;
        interpretationArea.classList.add('hidden');
      }
    }
  </script>
